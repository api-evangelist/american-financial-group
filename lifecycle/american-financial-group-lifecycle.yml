method: searched
source: https://api-documentation.gaig.com/{service}/index.html — every published reference page carries a footer "Version <n> Last updated <timestamp>"
versioning:
  scheme: per-api document version, semver-shaped, all still 0.x
  in_url: false
  in_header: false
  note: >-
    There is no /v1 path segment, no version header and no published version-negotiation policy. Each API
    reference page instead carries a document version and a last-updated timestamp in its footer, and every
    one of the 18 APIs is still on a 0.x version number after up to three years in production.
  policy_published: false
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    No deprecation policy, notice period, Sunset/Deprecation header (RFC 8594) or migration guidance
    appears on any of the 18 reference pages. Nothing in any of the 18 OpenAPI documents is marked
    deprecated. Because entitlement is per consumer, the practical deprecation signal is a 501
    Not Implemented from an endpoint that GET /api/endpoints no longer lists.
