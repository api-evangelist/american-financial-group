name: American Financial Group
description: 'American Financial Group (AFG) is a Cincinnati-based holding company engaged primarily
  in property and casualty insurance, focusing on specialized commercial products for businesses, and
  in the sale of fixed and indexed annuities through its Great American Insurance Group and Great American
  Life subsidiaries. AFG serves businesses across more than 40 specialty markets including agriculture,
  aviation, cyber, environmental, equine, ocean marine, professional liability, and transportation.
  Its machine-readable API surface is Great American Carrier Services: eighteen REST APIs published
  at api-documentation.gaig.com — shop, submission, product, risk selection, rating, forms, issuance,
  policy, document, billing, ingestion, risk assessment, letters, producer, contract, opportunity, notification
  and claims — each with an OpenAPI 3.0 document, all secured with OAuth 2.0 client credentials, and
  available to appointed agents, brokers, MGAs and program administrators through a four-phase onboarding
  engagement rather than self-service signup.'
